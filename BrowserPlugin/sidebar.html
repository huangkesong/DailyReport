<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>日报助手</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .date {
            font-size: 14px;
            color: #666;
        }
        .section {
            flex: 1;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title .time {
            font-size: 12px;
            color: #666;
            font-weight: normal;
        }
        textarea {
            width: 100%;
            height: calc(100% - 30px);
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }
        .actions {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }
        button {
            flex: 1;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        #exportBtn {
            background: #2196F3;
        }
        #exportBtn:hover {
            background: #1976D2;
        }
        .history-btn {
            background: #9E9E9E;
            padding: 4px 8px;
            font-size: 12px;
        }
        .history-btn:hover {
            background: #757575;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>日报记录【sidebar】</h2>
            <div class="date" id="currentDate"></div>
        </div>
        
        <div class="section">
            <div class="section-title">
                <span>已完成工作</span>
                <button class="history-btn" onclick="viewHistory('completed')">历史记录</button>
            </div>
            <textarea id="completedWork" placeholder="请输入今天已完成的工作内容..."></textarea>
        </div>

        <div class="section">
            <div class="section-title">
                <span>进行中工作</span>
                <button class="history-btn" onclick="viewHistory('ongoing')">历史记录</button>
            </div>
            <textarea id="ongoingWork" placeholder="请输入正在进行的工作内容..."></textarea>
        </div>

        <div class="section">
            <div class="section-title">
                <span>遇到的问题</span>
                <button class="history-btn" onclick="viewHistory('problems')">历史记录</button>
            </div>
            <textarea id="problems" placeholder="请输入遇到的问题或需要协助的事项..."></textarea>
        </div>

        <div class="actions">
            <button id="saveBtn">保存日报</button>
            <button id="exportBtn">导出日报</button>
        </div>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
